<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Knowledge — Super DIITian</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/chatbot.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner" onclick="window.location.href='../index.html'" style="cursor: pointer;">
      <img class="site-header__logo" src="../templates/diititan-logo.PNG" alt="Logo">
    </div>
  </header>
  <div class="hub-container">
    <button type="button" class="hub-back-btn" onclick="window.location.href='../index.html'">&larr; Back to Dashboard</button>
    <div class="hub-panel">
      <h2>🧠 Daily Knowledge Hub</h2>
      <div class="knowledge-container">
        <div class="knowledge-categories-bar">
          <button class="k-cat-btn is-active" onclick="fetchKnowledge('science', 'বিজ্ঞান', this)">🔬 বিজ্ঞান</button>
          <button class="k-cat-btn" onclick="fetchKnowledge('space', 'মহাকাশ', this)">🌌 মহাকাশ</button>
          <button class="k-cat-btn" onclick="fetchKnowledge('technology', 'প্রযুক্তি', this)">💻 প্রযুক্তি</button>
          <button class="k-cat-btn" onclick="fetchKnowledge('history', 'ইতিহাস', this)">🏛️ ইতিহাস</button>
        </div>
        <div class="knowledge-grid" id="knowledgeCardContainer">
          <div class="knowledge-loading">🧠 উইকিপিডিয়া থেকে তথ্য আহরণ করা হচ্ছে...</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/notice.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { fetchKnowledge('science', 'বিজ্ঞান'); });
  </script>
</body>
</html>
