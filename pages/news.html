<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangladesh News — Super DIITian</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/chatbot.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner" onclick="window.location.href='../index.html'" style="cursor: pointer;">
      <img class="site-header__logo" src="../templates/diititan-logo.PNG" alt="Logo">
    </div>
  </header>
  <div class="hub-container">
    <button type="button" class="hub-back-btn" onclick="window.location.href='../index.html'">&larr; Back to Dashboard</button>
    <div class="hub-panel">
      <h2>Bangladesh Live News</h2>
      <div class="news-container">
        <div class="news-categories-bar">
          <button class="news-cat-btn is-active" onclick="fetchNews('politics', this)">🏛️ রাজনীতি</button>
          <button class="news-cat-btn" onclick="fetchNews('technology', this)">💻 টেকনোলজি</button>
          <button class="news-cat-btn" onclick="fetchNews('science', this)">🔬 বিজ্ঞান</button>
          <button class="news-cat-btn" onclick="fetchNews('sports', this)">🏏 খেলাধুলা</button>
        </div>
        <div class="news-grid" id="newsGridContainer">
          <div class="news-loading">📰 লাইভ নিউজ লোড হচ্ছে...</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/notice.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { fetchNews('politics'); });
  </script>
</body>
</html>
