<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory — Super DIITian</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/students.css">
  <link rel="stylesheet" href="../css/chatbot.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner" onclick="window.location.href='../index.html'" style="cursor: pointer;">
      <img class="site-header__logo" src="../templates/diititan-logo.PNG" alt="Logo">
    </div>
  </header>
  <div class="hub-container">
    <button type="button" class="hub-back-btn" onclick="window.location.href='../index.html'">&larr; Back to Dashboard</button>
    <div class="hub-panel">
      <h2>CSE 26th Batch Student Directory</h2>
      <div class="directory-header-box">
        <div class="directory-search-wrapper">
          <input type="text" id="studentSearch" class="directory-search-input" placeholder="Search by name or roll number..." oninput="filterStudents()" />
        </div>
        <span class="directory-count-badge" id="studentTotalCount">76 Students</span>
      </div>
      <div class="students-card-grid" id="studentCardContainer"></div>
    </div>
  </div>
  <script src="../js/students.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderStudentCards();
    });
  </script>
</body>
</html>
