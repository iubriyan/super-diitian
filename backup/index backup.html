<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CR GPT — ক্লাস রুটিন সহকারী</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="board">
    <header class="board-header">
      <span class="pin" aria-hidden="true"></span>
      <h1>CR <span>GPT</span></h1>
      <p class="subtitle">যা খুশি জিজ্ঞেস করো</p>
    </header>

    <main class="chat-wrap">
      <div class="chat-log" id="chatLog">
        <div class="msg bot">
          <span class="avatar">CR</span>
          <div class="bubble">
            আসসালামু আলাইকুম! আমি <strong>CR GPT</strong>।
            ক্লাস কবে, কখন, কোন রুমে, কোন স্যার/ম্যাডাম নেবেন — যেকোনো কিছু জিজ্ঞেস করতে পারো।
          </div>
        </div>
      </div>
    </main>

    <form class="composer" id="composer">
      <input
        type="text"
        id="msgInput"
        placeholder="যেমনঃ শনিবার কী কী ক্লাস আছে?"
        autocomplete="off"
      />
      <button type="submit" id="sendBtn" aria-label="পাঠাও">➤</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
